name: Build Windows CUDA Wheel

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive  # 拉取自带兼容版本的 llama.cpp，绝不做多余操作

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CUDA Toolkit 12.1
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.1.0'

      - name: Build Wheel
        shell: pwsh  # 改用 PowerShell 处理环境变量，比 cmd 更稳定
        run: |
          pip install cmake ninja scikit-build-core
          
          # 1. 限制并行编译，防止云端 16G 内存溢出被系统 Kill
          $env:CMAKE_BUILD_PARALLEL_LEVEL="2"
          
          # 2. 核心：开启 CUDA，并指定你的 RTX 4070 架构（sm_89）
          $env:CMAKE_ARGS="-DGGML_CUDA=on -DCMAKE_CUDA_ARCHITECTURES=89"
          
          # 3. 强制重新配置 CMake
          $env:FORCE_CMAKE="1"
          
          # 4. 开始编译
          pip wheel . --no-deps -w dist

      - name: Upload Wheel
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-python-wheel-cu121
          path: dist/*.whl
