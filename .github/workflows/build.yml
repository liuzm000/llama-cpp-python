name: Build Windows CUDA Wheel

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 强制更新 llama.cpp 到最新，确保支持 Qwen3.5
      - name: Update llama.cpp submodule
        shell: bash
        run: |
          cd vendor/llama.cpp
          git fetch --all
          git checkout origin/master

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install CUDA Toolkit 12.1
        uses: Jimver/cuda-toolkit@v0.2.19
        with:
          cuda: '12.1.0'

      - name: Build Wheel
        shell: cmd
        run: |
          pip install cmake ninja scikit-build-core
          :: 【关键修改1】强制指定你的 4070 架构（sm_89），防止编译报错
          set CMAKE_ARGS="-DGGML_CUDA=on -DCMAKE_CUDA_ARCHITECTURES=89"
          :: 【关键修改2】限制并行编译数，防止云端内存溢出被 Kill
          set CMAKE_BUILD_PARALLEL_LEVEL=2
          set FORCE_CMAKE=1
          pip wheel . --no-deps -w dist

      - name: Upload Wheel
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-python-wheel-cu121
          path: dist/*.whl
